name: Streamlit Keep Alive

on:
  schedule:
    - cron: '0 */6 * * *' # 6시간마다 실행 (UTC)
  workflow_dispatch:       # GitHub Actions에서 수동 실행 가능

jobs:
  keep_alive:
    runs-on: ubuntu-latest

    steps:
      - name: Wake up Streamlit app
        run: |
          curl --fail --max-time 60 \
            -A "Mozilla/5.0" \
            https://bond-macro-dashboard-j12.streamlit.app/
