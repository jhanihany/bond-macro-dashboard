name: Streamlit Keep Alive

on:
  schedule:
    - cron: '0 */6 * * *' # 6시간마다 실행 (UTC)
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Wake up Streamlit app
        run: |
          python - <<'PY'
          import re
          from playwright.sync_api import sync_playwright

          URL = "https://bond-macro-dashboard-j12.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent=(
                      "Mozilla/5.0 (X11; Linux x86_64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/140.0.0.0 Safari/537.36"
                  )
              )
              page = context.new_page()
              page.set_default_timeout(15000)

              print(f"Opening: {URL}")
              page.goto(URL, wait_until="domcontentloaded", timeout=120000)
              page.wait_for_timeout(5000)

              print(f"Initial URL: {page.url}")
              print(f"Page title: {page.title()}")

              body_text = page.locator("body").inner_text(timeout=10000)
              print("Page text:")
              print(body_text[:5000])

              wake_patterns = [
                  re.compile(r"yes, get this app back up!", re.I),
                  re.compile(r"get this app back up!", re.I),
              ]

              clicked = False

              for pattern in wake_patterns:
                  button = page.get_by_role("button", name=pattern)
                  if button.count() > 0:
                      print(f"Wake-up button found: {pattern.pattern}")
                      button.first.click()
                      clicked = True
                      print("Wake-up button clicked.")
                      break

              if not clicked:
                  text_locator = page.get_by_text(
                      re.compile(r"get this app back up!", re.I)
                  )
                  if text_locator.count() > 0:
                      print("Wake-up text found. Clicking it.")
                      text_locator.first.click()
                      clicked = True
                      print("Wake-up control clicked.")

              if clicked:
                  print("Waiting for the app to start...")
                  page.wait_for_timeout(30000)

                  print(f"Final URL: {page.url}")
                  final_text = page.locator("body").inner_text(timeout=10000)
                  print("Final page text:")
                  print(final_text[:3000])

                  if re.search(r"get this app back up", final_text, re.I):
                      print("ERROR: Streamlit still appears to be sleeping.")
                      page.screenshot(path="streamlit_wakeup_failed.png", full_page=True)
                      raise SystemExit(1)

                  print("Streamlit wake-up request completed.")
              else:
                  if "streamlit" in body_text.lower() or "bond" in body_text.lower():
                      print("Wake-up button not found; the app appears to be awake.")
                  else:
                      print("ERROR: Wake-up button was not found and the page does not look like the Streamlit app.")
                      page.screenshot(path="streamlit_unexpected_page.png", full_page=True)
                      raise SystemExit(1)

              browser.close()
          PY

      - name: Upload debug screenshot if created
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-debug-screenshot
          path: |
            streamlit_wakeup_failed.png
            streamlit_unexpected_page.png
          if-no-files-found: ignore
