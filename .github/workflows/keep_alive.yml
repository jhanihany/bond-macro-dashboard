name: Streamlit Keep Alive

on:
  # 6시간마다 실행 (UTC 기준)
  schedule:
    - cron: '0 */6 * * *'

  # GitHub Actions에서 수동 실행 가능
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest

    steps:

      # Python 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Playwright와 Chromium 설치
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      # Streamlit 앱 접속 및 깨우기
      - name: Wake up Streamlit app
        run: |
          python - <<'PY'
          import re
          from playwright.sync_api import sync_playwright

          URL = "https://bond-macro-dashboard-j12.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              # 페이지 접속
              print(f"Opening: {URL}")
              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=120000
              )

              # 페이지가 렌더링될 시간 확보
              page.wait_for_timeout(5000)

              # 현재 페이지의 텍스트 확인
              body_text = page.locator("body").inner_text()

              # Sleeping 상태인지 확인
              if re.search(
                  r"get this app back up!",
                  body_text,
                  re.I
              ):
                  print("Streamlit app is sleeping.")

                  # 깨우기 버튼 찾기
                  button = page.get_by_role(
                      "button",
                      name=re.compile(
                          r"get this app back up!",
                          re.I
                      )
                  )

                  # 버튼 클릭
                  if button.count() > 0:
                      button.first.click()
                      print("Wake-up button clicked.")

                      # 앱이 깨어날 때까지 대기
                      page.wait_for_timeout(30000)

                      # 다시 페이지 내용 확인
                      final_text = page.locator(
                          "body"
                      ).inner_text()

                      # 여전히 Sleeping 상태라면 실패
                      if re.search(
                          r"get this app back up!",
                          final_text,
                          re.I
                      ):
                          print("ERROR: App is still sleeping.")
                          page.screenshot(
                              path="streamlit_wakeup_failed.png",
                              full_page=True
                          )
                          raise SystemExit(1)

                      print("Streamlit app successfully woke up.")

                  else:
                      print("ERROR: Wake-up button not found.")
                      raise SystemExit(1)

              else:
                  print("Streamlit app is already awake.")

              browser.close()
          PY

      # 실패 시 생성된 스크린샷 업로드
      - name: Upload debug screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-debug-screenshot
          path: streamlit_wakeup_failed.png
          if-no-files-found: ignore
